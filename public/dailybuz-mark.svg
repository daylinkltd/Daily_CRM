<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- Dailybuz mark. Derived from the Daylink "D": same navy-to-blue
       gradient and offset-square signature. The bowl meets the stem so it
       reads as a D, and one detached arc outside it carries the "buzz". -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14274E"/>
      <stop offset="55%" stop-color="#1268B3"/>
      <stop offset="100%" stop-color="#0A9FE0"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="7" height="28" fill="url(#g)"/>
  <path d="M13 6 A 14 14 0 0 1 13 34" fill="none" stroke="url(#g)" stroke-width="7"/>
  <path d="M15.5 1.8 A 18.4 18.4 0 0 1 15.5 38.2" fill="none" stroke="url(#g)" stroke-width="2" opacity="0.38"/>
  <rect x="6" y="0.5" width="4.5" height="4.5" fill="#0A9FE0"/>
</svg>
